[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saham-gorengan"
version = "0.1.0"
description = "Labelled IDX stock-manipulation cases from OJK enforcement, plus the ARA/ARB price-limit regime history."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8"]
yahoo = ["yfinance>=0.2.50", "curl_cffi"]

[tool.hatch.build.targets.wheel]
packages = ["src/saham_gorengan"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "saham_gorengan/data"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
